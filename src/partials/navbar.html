{{#if simpleMode}} {{> navbar-simple}} {{else}}
<nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-30">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <div
        class="flex-shrink-0 flex items-center cursor-pointer"
        id="home-logo"
      >
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/logo.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}المحرر{{/if}} Logo"
          class="h-8 w-8"
        />
        <span id="nav-brand" class="text-white font-bold text-xl ms-2">
          <a href="index.html"
            >{{#if brandName}}{{brandName}}{{else}}المحرر{{/if}}</a
          >
        </span>
      </div>

      <div id="language-switcher-container" class="flex-shrink-0"></div>
    </div>
  </div>
</nav>
{{/if}}
