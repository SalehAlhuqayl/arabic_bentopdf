{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="mt-16 border-t border-gray-700 py-8">
  <div class="container mx-auto px-4 text-center">
    <div class="flex items-center justify-center mb-3">
      <img
        id="footer-logo"
        src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/logo.svg{{/if}}"
        alt="{{#if brandName}}{{brandName}}{{else}}المحرر{{/if}} Logo"
        class="h-8 w-8 me-2"
      />
      <span id="footer-brand" class="text-lg font-bold text-white">{{#if brandName}}{{brandName}}{{else}}المحرر{{/if}}</span>
    </div>
    <p id="footer-copyright" class="text-gray-400 text-sm" {{#unless footerText}}data-i18n="footer.copyright"{{/unless}}>
      {{#if footerText}}{{footerText}}{{else}}&copy; 2026 المحرر{{/if}}
    </p>
    <p class="text-gray-500 text-xs mt-2">
      <span data-i18n="footer.version">Version</span>
      <span id="app-version">{{appVersion}}</span>
    </p>
  </div>
</footer>
{{/if}}
